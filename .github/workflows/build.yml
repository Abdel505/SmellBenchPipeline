name: Build and Run Benchmark Tests

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Project
        run: ./gradlew clean

      - name: Build Project
        run: ./gradlew build

      - name: Set execute permission for pipeline scripts
        run: |
          chmod +x modified_classes_detector.sh
          chmod +x benchmark_tests.sh
          chmod +x test_case_selection.sh
          chmod +x generate_benchmark.sh

      - name: Run Modified Classes Detector
        run: ./modified_classes_detector.sh
        env:
          ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}

      - name: Generate Benchmarks for Smelly Methods
        run: |
          if [[ ! -f smelly_methods.txt ]]; then
            echo "No smelly_methods.txt found — skipping benchmark generation (filter not yet run)"
            exit 0
          fi
          while IFS='|' read -r java_file method; do
            java_file="$(echo "$java_file" | xargs)"
            method="$(echo "$method" | xargs)"
            echo "Generating benchmark for $java_file :: $method"
            bash generate_benchmark.sh "$java_file" "$method"
          done < smelly_methods.txt
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
