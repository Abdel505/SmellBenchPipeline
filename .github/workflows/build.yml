name: Build and Run Benchmark Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      method_scope:
        description: "Which changed methods to process"
        type: choice
        options:
          - both
          - added
          - modified
        default: both
      max_methods:
        description: "Methods to check with the LLM: all, or the first N"
        type: string
        default: '2'
      max_templates:
        description: "Smell templates to check per method: all, or the first N"
        type: string
        default: '2'

# One pipeline run per branch at a time (both jobs write data/ and push).
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

# Same values as sut.env, shared by every step.
env:
  SUT_GIT_DIR: sut/byte-buddy
  SUT_SRC_FILTER: "byte-buddy-dep/src/main/java.*\\.java$"
  SUT_SRC_STRIP: "byte-buddy-dep/src/main/java/"
  SUT_SRC_ROOT: "${{ github.workspace }}/sut/byte-buddy/byte-buddy-dep/src/main/java"

jobs:

  # ─── JOB 1: detect → collect → smells → filter → matrix ─────────────
  pipeline:
    name: Detect, Smell-check & Generate Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # fetch-depth 2: detect diffs HEAD~1..HEAD of the SUT.
      - name: Checkout byte-buddy (SUT)
        uses: actions/checkout@v4
        with:
          repository: raphw/byte-buddy
          path: sut/byte-buddy
          fetch-depth: 2

      - name: Set up JDK 21   # ast-generator.jar is compiled for Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: smell-checker/requirements.txt

      - name: Install smell-checker dependencies
        run: pip install -r smell-checker/requirements.txt

      - name: Detect changed methods
        run: bash scripts/detect_changed_methods.sh

      - name: Collect applicability targets
        run: bash scripts/collect_applicability_targets.sh
        env:
          METHOD_SCOPE: ${{ inputs.method_scope || 'both' }}

      - name: Check smell applicability (LLM)
        run: python smell-checker/smell_applicability_checker.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # Push runs use the fallback ('2'); manual runs use the inputs (type 'all' for everything).
          MAX_METHODS: ${{ inputs.max_methods || '2' }}
          MAX_TEMPLATES: ${{ inputs.max_templates || '2' }}

      - name: Filter smelly methods
        run: bash scripts/filter_methods_2.sh

      # Restores benchmarks/ into the SUT, generates new ones, saves them back to benchmarks/.
      - name: Update coverage matrix (generate benchmarks)
        run: bash scripts/update_coverage_matrix.sh
        env:
          BENCH_API_KEY: ${{ secrets.BENCH_API_KEY }}
          BENCH_ENDPOINT: ${{ secrets.BENCH_ENDPOINT }}
          BENCH_MODEL: ${{ secrets.BENCH_MODEL }}

      # Jobs run on separate machines: hand the results to job 2.
      - name: Upload pipeline state
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state
          path: |
            pipeline-output/
            data/coverage-matrix.csv
            data/best-result.json
            benchmarks/
          if-no-files-found: warn
          retention-days: 7

  # ─── JOB 2: runbench (plain JMH) → commit results ──────────────────
  benchmarks:
    name: Run Benchmarks & Commit Results
    runs-on: ubuntu-latest
    needs: pipeline
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout byte-buddy (SUT)
        uses: actions/checkout@v4
        with:
          repository: raphw/byte-buddy
          path: sut/byte-buddy
          fetch-depth: 2

      - name: Set up JDK 21   # ast-generator.jar is compiled for Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # config_guard / bootstrap / dashboard helpers use only the standard library.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download pipeline state
        uses: actions/download-artifact@v4
        with:
          name: pipeline-state
          path: .

      # An empty matrix would make run-benchmarks.sh fall back to ALL byte-buddy benchmarks.
      - name: Run JMH benchmarks (coverage-matrix)
        run: |
          if [[ ! -s data/coverage-matrix.csv ]]; then
            echo "Coverage matrix is empty — nothing to benchmark."; exit 0
          fi
          bash scripts/run-benchmarks.sh
        env:
          RUN_AMBER: "0"
          # Must match the stored baseline in best-result.json, or benchmarks are skipped
          # as CONFIG_MISMATCH (set CONFIG_OVERRIDE: "1" once to rebaseline).
          JMH_FORKS: "3"
          JMH_MEASURE_ITER: "3"
          JMH_WARMUP_ITER: "3"
          JMH_WARMUP_TIME: "1s"
          JMH_MEASURE_TIME: "1s"
          AMBER_TIMEOUT: "1m"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only the durable state; per-run reports go to the artifact below.
          git add data/coverage-matrix.csv data/best-result.json benchmarks/
          git diff --cached --quiet || \
            git commit -m "chore: update benchmark results [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            data/jmh-result.json
            data/best-result.json
            bench-reports/
          retention-days: 30
