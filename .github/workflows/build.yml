name: Build and Run Benchmark Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ─── JOB 1 ───────────────────────────────────────────
  build:
    name: Build Project
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout byte-buddy (SUT)
        uses: actions/checkout@v4
        with:
          repository: raphw/byte-buddy
          path: sut/byte-buddy
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Project
        run: ./gradlew clean

      - name: Build Project
        run: ./gradlew build

  # ─── JOB 2 ───────────────────────────────────────────
  detect-and-collect:
    name: Detect Changes & Collect Targets
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout byte-buddy (SUT)
        uses: actions/checkout@v4
        with:
          repository: raphw/byte-buddy
          path: sut/byte-buddy
          fetch-depth: 2

      - name: Set execute permissions
        run: |
          chmod +x scripts/detect_changed_methods.sh
          chmod +x scripts/collect_applicability_targets.sh

      - name: Detect Changed Methods
        run: bash scripts/detect_changed_methods.sh
        env:
          ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
          SUT_GIT_DIR: sut/byte-buddy
          SUT_SRC_FILTER: "byte-buddy-dep/src/main/java.*\\.java$"
          SUT_SRC_STRIP: "byte-buddy-dep/src/main/java/"
          SUT_SRC_ROOT: "${{ github.workspace }}/sut/byte-buddy/byte-buddy-dep/src/main/java"

      - name: Collect Applicability Targets
        run: bash scripts/collect_applicability_targets.sh
        env:
          SUT_SRC_ROOT: "${{ github.workspace }}/sut/byte-buddy/byte-buddy-dep/src/main/java"

  # ─── JOB 3 ───────────────────────────────────────────
  smell-check:
    name: LLM Smell Check
    runs-on: ubuntu-latest
    needs: detect-and-collect

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install smell-checker dependencies
        run: pip install -r smell-checker/requirements.txt

      - name: Check Smell Applicability (LLM)
        run: python smell-checker/smell_applicability_checker.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

      - name: Set execute permission for filter script
        run: chmod +x scripts/filter_methods_2.sh

      - name: Run LLM Smell Filter
        run: bash scripts/filter_methods_2.sh

  # ─── JOB 4 ───────────────────────────────────────────
  coverage:
    name: Update Coverage Matrix
    runs-on: ubuntu-latest
    needs: smell-check
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout byte-buddy (SUT)
        uses: actions/checkout@v4
        with:
          repository: raphw/byte-buddy
          path: sut/byte-buddy
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set execute permission for gradlew
        run: chmod +x gradlew

      - name: Set execute permissions for scripts
        run: |
          chmod +x scripts/update_coverage_matrix.sh
          chmod +x scripts/generate_benchmark.sh
          chmod +x tools/dashboard/generate_dashboard.sh

      - name: Update Coverage Matrix
        run: bash scripts/update_coverage_matrix.sh
        env:
          BENCH_API_KEY: ${{ secrets.BENCH_API_KEY }}
          BENCH_ENDPOINT: ${{ secrets.BENCH_ENDPOINT }}
          BENCH_MODEL: ${{ secrets.BENCH_MODEL }}
          SUT_SRC_ROOT: "${{ github.workspace }}/sut/byte-buddy/byte-buddy-dep/src/main/java"

  # ─── JOB 5 ───────────────────────────────────────────
  benchmarks:
    name: Run Benchmarks with AMBER
    runs-on: ubuntu-latest
    needs: smell-check

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout byte-buddy (SUT)
        uses: actions/checkout@v4
        with:
          repository: raphw/byte-buddy
          path: sut/byte-buddy
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set execute permission for gradlew
        run: chmod +x gradlew

      - name: Set execute permissions for scripts
        run: chmod +x scripts/run-benchmarks.sh

      - name: Pull AMBER Docker image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/jpt-service:latest

      - name: Start AMBER service
        run: |
          docker run -d \
            --name amber \
            -p 5001:5001 \
            ${{ secrets.DOCKER_USERNAME }}/jpt-service:latest

      - name: Wait for AMBER to be ready
        run: |
          echo "Waiting for AMBER service..."
          for i in $(seq 1 120); do
            if curl -sf http://localhost:5001; then
              echo "AMBER is up!"
              exit 0
            fi
            echo "Attempt $i/120 - not ready yet, waiting 10s..."
            sleep 10
          done
          echo "AMBER failed to start after 1200 seconds"
          exit 1

      - name: Run JMH Benchmarks with AMBER
        run: bash scripts/run-benchmarks.sh "net.bytebuddy.benchmark.ClassFileVersionBenchmark.getJavaVersion"
        env:
          AMBER_MODEL: oscnn
          AMBER_FORKS: "5"
          AMBER_WI: "1"
          AMBER_WTIME: "1s"
          AMBER_MI: "2"
          AMBER_MTIME: "1s"
          AMBER_TIMEOUT: "1m"
          RUN_AMBER: "1"
          AMBER_HOST: "localhost"
          AMBER_PORT: "5001"

      - name: Stop AMBER service
        if: always()
        run: docker stop amber && docker rm amber

  # ─── JOB 6 ───────────────────────────────────────────
  commit-and-upload:
    name: Commit Results & Upload Artifacts
    runs-on: ubuntu-latest
    needs: [coverage, benchmarks]
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/coverage-matrix.csv data/jmh-result.json \
                  data/best-result.json bench-reports/ app/src/test/java/ || true
          git diff --cached --quiet || \
            git commit -m "chore: update benchmark results [skip ci]"
          git push origin main

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            data/jmh-result.json
            data/best-result.json
            bench-reports/
          retention-days: 30
