name: Build and Run Benchmark Tests

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Project
        run: ./gradlew clean

      - name: Build Project
        run: ./gradlew build

      - name: Set execute permission for pipeline scripts
        run: |
          chmod +x scripts/detect_changed_methods.sh
          chmod +x scripts/collect_applicability_targets.sh
          chmod +x scripts/filter_methods_2.sh
          chmod +x scripts/update_coverage_matrix.sh
          chmod +x scripts/run-benchmarks.sh
          chmod +x scripts/lookup_benchmark.sh
          chmod +x scripts/generate_benchmark.sh
          chmod +x scripts/run_mutation_testing.sh
          chmod +x tools/dashboard/generate_dashboard.sh

      - name: Detect Changed Methods
        run: bash scripts/detect_changed_methods.sh
        env:
          ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}

      - name: Collect Applicability Targets
        run: bash scripts/collect_applicability_targets.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install smell-checker dependencies
        run: pip install -r smell-checker/requirements.txt

      - name: Check Smell Applicability (LLM)
        run: python smell-checker/smell_applicability_checker.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

      - name: Run LLM Smell Filter
        run: bash scripts/filter_methods_2.sh

      - name: Update Coverage Matrix (smelly + deleted methods)
        run: bash scripts/update_coverage_matrix.sh
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}

      - name: Run JMH Benchmarks with AMBER
        run: bash scripts/run-benchmarks.sh
        env:
          AMBER_MODEL: oscnn
          AMBER_FORKS: "5"
          AMBER_WI: "1"
          AMBER_WTIME: "1s"
          AMBER_MI: "2"
          AMBER_MTIME: "1s"
          AMBER_TIMEOUT: "1m"
          RUN_AMBER: "1"

      - name: Compile and run tests
        run: ./gradlew :app:test

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/coverage-matrix.csv data/jmh-result.json \
                  amber-results/ app/src/test/java/ || true
          git diff --cached --quiet || \
            git commit -m "chore: update benchmark results [skip ci]"
          git push

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            data/jmh-result.json
            amber-results/
          retention-days: 30
